services:
  antispam:
    build:
      context: .
      dockerfile: service/Dockerfile
    image: mkb251-razhnovap-antispam:2.0.0
    container_name: mkb251-razhnovap-antispam
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
